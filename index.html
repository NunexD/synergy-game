<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Draft Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Synergy Draft</h1>
    <div class="stats">
        🪙 Coins: <span id="coins">10</span> | ❤️ Lives: <span id="lives">5</span>
    </div>
</header>

<main>
    <!-- ========================================== -->
    <!-- DRAFT PHASE: Shop, Team Management, & Sell -->
    <!-- ========================================== -->
    <div id="draft-phase">
        <section id="shop-section">
            <h2>The Shop (Click to Buy)</h2>
            <div id="shop-container" class="slot-container"></div>
        </section>

        <section id="management-section">
            <h2>Your Team (Drag to rearrange)</h2>
            <p style="font-size: 0.9rem; color: #888; margin-top: -10px;">Frontline is on the RIGHT. They attack first!</p>
            <div id="team-container" class="slot-container"></div>

            <!-- The Sell Zone -->
            <div id="sell-zone">
                🗑️ Drag a unit here to sell for 🪙1
            </div>
        </section>

        <button id="battle-btn">⚔️ TO THE ARENA ⚔️</button>
    </div>

    <!-- ========================================== -->
    <!-- BATTLE PHASE: Left vs Right Combat         -->
    <!-- ========================================== -->
    <div id="battle-phase" style="display: none;">
        <div class="arena">
            <!-- Player Side (Left) -->
            <section id="arena-player">
                <h2>Your Team</h2>
                <!-- row-reverse makes the first unit face the center -->
                <div id="combat-player-container" class="slot-container reverse-row"></div>
            </section>

            <div class="vs-badge">VS</div>

            <!-- Enemy Side (Right) -->
            <section id="arena-enemy">
                <h2>Enemy Team</h2>
                <div id="combat-enemy-container" class="slot-container"></div>
            </section>
        </div>

        <div id="battle-log">The battle begins...</div>
        <button id="next-round-btn" style="display: none;">Next Round ➔</button>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
